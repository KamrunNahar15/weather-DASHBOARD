<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Weather Dashboard</title>
    <!-- Google Font + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #0a1a2f 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #f1f5f9;
        }

        .dashboard {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* header */
        .header {
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0f2fe, #7ab3fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        /* search */
        .search-panel {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.2rem;
        }
        .search-box {
            flex: 2;
            min-width: 260px;
            display: flex;
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.2s;
        }
        .search-box:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .search-box i {
            padding: 0 18px;
            line-height: 52px;
            color: #9ab3d5;
        }
        .search-box input {
            background: transparent;
            border: none;
            flex: 1;
            padding: 0 18px 0 0;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            outline: none;
        }
        .search-box input::placeholder {
            color: #6b7f9b;
        }
        button {
            background: #2563eb;
            border: none;
            padding: 0 28px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button:hover {
            background: #1d4ed8;
            transform: scale(0.97);
        }
        .location-btn {
            background: rgba(45, 55, 72, 0.9);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .location-btn:hover {
            background: #1f2a3e;
        }

        /* status */
        .status-card {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1.5rem 0;
        }
        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* current weather card */
        .weather-card {
            background: rgba(10, 25, 45, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.6rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.3);
        }
        .weather-main {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }
        .city-info h2 {
            font-size: 2rem;
            font-weight: 700;
        }
        .city-info p {
            color: #b9cef0;
            margin-top: 5px;
        }
        .temp-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .temp-area i {
            font-size: 3rem;
            color: #ffd966;
        }
        .temp {
            font-size: 3.2rem;
            font-weight: 800;
            color: #facc15;
        }
        .condition {
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: capitalize;
        }
        .details {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        .detail-item {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-item i {
            font-size: 1.3rem;
            color: #60a5fa;
        }
        .detail-text span:first-child {
            font-size: 0.7rem;
            color: #afc4e6;
            display: block;
        }
        .detail-text span:last-child {
            font-size: 1rem;
            font-weight: 600;
        }

        /* forecast */
        .forecast h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .forecast-item {
            background: rgba(20, 35, 55, 0.65);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 0.9rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.2s;
        }
        .forecast-item:hover {
            transform: translateY(-3px);
            background: rgba(40, 65, 95, 0.7);
        }
        .day {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .forecast-icon i {
            font-size: 2rem;
            color: #facc15;
            margin: 8px 0;
        }
        .forecast-temp {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fcd34d;
        }
        .forecast-condition {
            font-size: 0.7rem;
            color: #aac3e0;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .temp { font-size: 2.5rem; }
            .city-info h2 { font-size: 1.5rem; }
            .detail-item { padding: 0.4rem 1rem; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    // Weather code mapping
    const getWeatherInfo = (code) => {
        const weatherMap = {
            0: { text: "Clear sky", icon: "fa-sun", emoji: "☀️" },
            1: { text: "Mainly clear", icon: "fa-cloud-sun", emoji: "🌤️" },
            2: { text: "Partly cloudy", icon: "fa-cloud-sun", emoji: "⛅" },
            3: { text: "Overcast", icon: "fa-cloud", emoji: "☁️" },
            45: { text: "Fog", icon: "fa-smog", emoji: "🌫️" },
            48: { text: "Fog", icon: "fa-smog", emoji: "🌫️" },
            51: { text: "Light drizzle", icon: "fa-cloud-rain", emoji: "🌦️" },
            53: { text: "Moderate drizzle", icon: "fa-cloud-rain", emoji: "🌧️" },
            55: { text: "Dense drizzle", icon: "fa-cloud-showers-heavy", emoji: "🌧️" },
            61: { text: "Light rain", icon: "fa-cloud-rain", emoji: "🌦️" },
            63: { text: "Moderate rain", icon: "fa-cloud-showers-heavy", emoji: "🌧️" },
            65: { text: "Heavy rain", icon: "fa-cloud-showers-heavy", emoji: "🌧️" },
            71: { text: "Light snow", icon: "fa-snowflake", emoji: "❄️" },
            73: { text: "Moderate snow", icon: "fa-snowflake", emoji: "❄️" },
            75: { text: "Heavy snow", icon: "fa-snowflake", emoji: "❄️" },
            80: { text: "Rain showers", icon: "fa-cloud-sun-rain", emoji: "🌦️" },
            81: { text: "Rain showers", icon: "fa-cloud-showers-heavy", emoji: "🌧️" },
            82: { text: "Violent showers", icon: "fa-cloud-showers-heavy", emoji: "⛈️" },
            95: { text: "Thunderstorm", icon: "fa-bolt", emoji: "⛈️" },
            96: { text: "Thunderstorm", icon: "fa-bolt", emoji: "⛈️" },
            99: { text: "Thunderstorm", icon: "fa-bolt", emoji: "⛈️" }
        };
        return weatherMap[code] || { text: "Unknown", icon: "fa-question", emoji: "🌡️" };
    };

    const formatForecastDay = (dateStr) => {
        return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };

    const App = () => {
        const [cityInput, setCityInput] = React.useState("Dhaka");
        const [current, setCurrent] = React.useState(null);
        const [forecast, setForecast] = React.useState([]);
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState("");

        // Get coordinates from city name
        const getCoordinates = async (city) => {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
            const res = await fetch(geoUrl);
            const data = await res.json();
            if (!data.results || data.results.length === 0) {
                throw new Error(`City "${city}" not found`);
            }
            const { latitude, longitude, name, country } = data.results[0];
            return { lat: latitude, lon: longitude, cityName: name, country };
        };

        // Fetch weather data
        const fetchWeather = async (lat, lon, displayCity, countryCode = "") => {
            setLoading(true);
            setError("");
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relativehumidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Weather data error");
                const data = await res.json();
                
                if (!data.current) throw new Error("Invalid response");

                const weatherCode = data.current.weather_code;
                const wInfo = getWeatherInfo(weatherCode);

                setCurrent({
                    city: displayCity,
                    country: countryCode,
                    temp: Math.round(data.current.temperature_2m),
                    feelsLike: Math.round(data.current.apparent_temperature),
                    humidity: data.current.relativehumidity_2m,
                    windSpeed: data.current.wind_speed_10m,
                    condition: wInfo.text,
                    icon: wInfo.icon,
                    emoji: wInfo.emoji,
                    time: data.current.time
                });

                // Process 5-day forecast (skip today)
                const daily = data.daily;
                const forecastList = [];
                for (let i = 1; i <= Math.min(5, daily.time.length - 1); i++) {
                    const code = daily.weather_code[i];
                    const info = getWeatherInfo(code);
                    forecastList.push({
                        date: daily.time[i],
                        maxTemp: Math.round(daily.temperature_2m_max[i]),
                        minTemp: Math.round(daily.temperature_2m_min[i]),
                        condition: info.text,
                        icon: info.icon,
                        emoji: info.emoji
                    });
                }
                setForecast(forecastList);
            } catch (err) {
                setError(err.message);
                setCurrent(null);
                setForecast([]);
            } finally {
                setLoading(false);
            }
        };

        const handleSearch = async () => {
            const city = cityInput.trim();
            if (!city) {
                setError("Enter a city name");
                return;
            }
            try {
                const { lat, lon, cityName, country } = await getCoordinates(city);
                await fetchWeather(lat, lon, cityName, country);
                setCityInput(cityName);
            } catch (err) {
                setError(err.message);
                setCurrent(null);
                setForecast([]);
            }
        };

        const handleLocation = () => {
            if (!navigator.geolocation) {
                setError("Geolocation not supported");
                return;
            }
            setLoading(true);
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    try {
                        await fetchWeather(pos.coords.latitude, pos.coords.longitude, "📍 My Location", "");
                    } catch (err) {
                        setError("Location weather failed");
                    }
                    setLoading(false);
                },
                () => {
                    setError("Location access denied");
                    setLoading(false);
                }
            );
        };

        // Initial load
        React.useEffect(() => {
            handleSearch();
        }, []);

        return (
            <div className="dashboard">
                <div className="header">
                    <h1><i className="fas fa-cloud-sun"></i> Weather Dashboard</h1>
                </div>

                <div className="search-panel">
                    <div className="search-box">
                        <i className="fas fa-search"></i>
                        <input 
                            type="text"
                            placeholder="Search city... e.g., Dhaka, London, Tokyo"
                            value={cityInput}
                            onChange={(e) => setCityInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                        />
                    </div>
                    <button onClick={handleSearch}><i className="fas fa-search"></i> Search</button>
                    <button className="location-btn" onClick={handleLocation}><i className="fas fa-location-dot"></i> My Location</button>
                </div>

                {loading && (
                    <div className="status-card">
                        <div className="loader"></div> Loading weather...
                    </div>
                )}

                {error && !loading && (
                    <div className="status-card" style={{background: 'rgba(180,30,30,0.2)'}}>
                        <i className="fas fa-exclamation-triangle"></i> {error}
                    </div>
                )}

                {!loading && current && (
                    <div className="weather-card">
                        <div className="weather-main">
                            <div className="city-info">
                                <h2>{current.city}{current.country ? `, ${current.country}` : ''}</h2>
                                <p><i className="far fa-clock"></i> {new Date(current.time).toLocaleString()}</p>
                            </div>
                            <div className="temp-area">
                                <i className={`fas ${current.icon}`}></i>
                                <div className="temp">{current.temp}°C</div>
                                <div className="condition">{current.condition} {current.emoji}</div>
                            </div>
                        </div>
                        <div className="details">
                            <div className="detail-item"><i className="fas fa-temperature-low"></i><div className="detail-text"><span>Feels like</span><span>{current.feelsLike}°C</span></div></div>
                            <div className="detail-item"><i className="fas fa-tint"></i><div className="detail-text"><span>Humidity</span><span>{current.humidity}%</span></div></div>
                            <div className="detail-item"><i className="fas fa-wind"></i><div className="detail-text"><span>Wind</span><span>{current.windSpeed} km/h</span></div></div>
                        </div>
                    </div>
                )}

                {!loading && forecast.length > 0 && (
                    <div className="forecast">
                        <h3><i className="fas fa-calendar-week"></i> 5-Day Forecast</h3>
                        <div className="forecast-grid">
                            {forecast.map((day, idx) => (
                                <div className="forecast-item" key={idx}>
                                    <div className="day">{formatForecastDay(day.date)}</div>
                                    <div className="forecast-icon"><i className={`fas ${day.icon}`}></i></div>
                                    <div className="forecast-temp">{day.maxTemp}° / {day.minTemp}°</div>
                                    <div className="forecast-condition">{day.condition}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {!loading && !current && !error && (
                    <div className="status-card">
                        <i className="fas fa-cloud-moon"></i> Search for a city to see weather
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
